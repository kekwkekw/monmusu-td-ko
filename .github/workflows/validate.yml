name: Validate pipeline

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-tests:
    name: Offline tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Check frozen policy and run synthetic regression tests
        run: python -X utf8 tools/update/cli.py preflight --report reports/preflight.json
      - name: Verify Master/UI authoring and public descriptors
        run: |
          python -X utf8 -m unittest discover -s tools -p test_ui_workflow.py -v
          python -X utf8 tools/build_manifests.py --check

  runtime-core-tests:
    name: Runtime core (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            6.0.x
            9.0.x
      - name: Test row matching and package cache without game assemblies
        run: dotnet run --project plugin/MonmusuMod.Tests/MonmusuMod.Tests.csproj -c Release
